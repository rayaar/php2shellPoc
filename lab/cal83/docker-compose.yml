services:
  cal83:
    image: php:8.3.35-apache
    container_name: php2shell-cal83
    ports:
      - "127.0.0.1:8106:80"
    volumes:
      - ../www:/var/www/html
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    command: >
      bash -c "
      echo 'memory_limit = 8M' > /usr/local/etc/php/conf.d/zz.ini;
      echo 'display_errors = On' >> /usr/local/etc/php/conf.d/zz.ini;
      a2dismod mpm_event mpm_worker 2>/dev/null;
      a2enmod mpm_prefork;
      sed -i 's/MaxRequestWorkers.*/MaxRequestWorkers 1/' /etc/apache2/mods-enabled/mpm_prefork.conf;
      sed -i 's/StartServers.*/StartServers 1/' /etc/apache2/mods-enabled/mpm_prefork.conf;
      sed -i 's/MinSpareServers.*/MinSpareServers 1/' /etc/apache2/mods-enabled/mpm_prefork.conf;
      sed -i 's/MaxSpareServers.*/MaxSpareServers 1/' /etc/apache2/mods-enabled/mpm_prefork.conf;
      apt-get update -qq && apt-get install -y -qq gdb >/dev/null;
      apache2-foreground
      "
