services:
  fpm:
    image: php:8.4.26-fpm
    container_name: chain-e-fpm
    volumes:
      - ./www:/var/www/html
      - ./sessions:/var/lib/php/sessions   # host-writeable session dir
    environment:
      - PHP_SESSION_SAVE_PATH=/var/lib/php/sessions
    command: >
      bash -c "
      mkdir -p /var/lib/php/sessions &&
      chown www-data:www-data /var/lib/php/sessions &&
      chmod 1733 /var/lib/php/sessions &&
      echo 'session.save_path = /var/lib/php/sessions' > /usr/local/etc/php/conf.d/zz-session.ini &&
      sed -i 's/pm = dynamic/pm = static\\npm.max_children = 1/' /usr/local/etc/php-fpm.d/www.conf &&
      sed -i '/pm.start_servers/d; /pm.min_spare_servers/d; /pm.max_spare_servers/d' /usr/local/etc/php-fpm.d/www.conf &&
      exec php-fpm -F
      "
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined

  nginx:
    image: nginx:stable
    container_name: chain-e-nginx
    ports:
      - "127.0.0.1:8107:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fpm
