events {}
http {
  upstream backend { server php2shell-lab:80; }
  server {
    listen 80;
    client_max_body_size 256m;          # upload-accepting site (WP media, forms)
    location / {
      proxy_pass http://backend;
      proxy_buffer_size 32k;            # room for the leak's big Set-Cookie header
      proxy_buffers 16 32k;
      proxy_busy_buffers_size 64k;
    }
  }
}
