; demo.ini - lowers memory_limit so the adaptive OOM probe hits on first try
; and the stage-3 reclaim window stays wide enough for a cold apache worker
; pool to land a shell. The real exploit works against the stock 128M default
; too (see the lab manifest), but a 15-second demo needs the simpler setup.
memory_limit = 8M
post_max_size = 256M
